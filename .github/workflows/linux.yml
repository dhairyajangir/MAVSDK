name: MAVSDK FTP errno profile helper 3175

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact 40-character helper/payload carrier commit
        required: true
        type: string
  push:
    branches:
      - ci/mavsdk3175-profile-validation-20261112

permissions:
  contents: read

jobs:
  validate-ftp-profile:
    if: >-
      github.repository == 'dhairyajangir/MAVSDK' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/ci/mavsdk3175-profile-validation-20261112'))
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || github.sha }}
      PINNED_IMAGE: docker.io/mavsdk/mavsdk-ubuntu-26.04@sha256:833cc96c63600976475f02a58110c22d8073bf2a1987cf047786ff206795eab5
    steps:
      - name: Validate the immutable carrier input
        id: input
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          out = pathlib.Path("helper-output/artifacts")
          (out / "logs").mkdir(parents=True, exist_ok=True)
          ref = os.environ["CANDIDATE_REF"]
          valid = re.fullmatch(r"[0-9a-f]{40}", ref) is not None
          if os.environ["EVENT_NAME"] == "push":
              valid = valid and ref == os.environ["EVENT_SHA"]
          (out / "bootstrap.json").write_text(json.dumps({
              "event": os.environ["EVENT_NAME"], "carrier": ref,
              "input_valid": valid, "permissions": "contents:read"
          }, indent=2) + "\n")
          if not valid:
              raise SystemExit("candidate_ref must be the exact 40-character carrier commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("candidate_ref=" + ref + "\n")
          PY

      - name: Checkout the helper implementation
        uses: actions/checkout@v6
        with:
          repository: dhairyajangir/MAVSDK
          ref: ${{ github.sha }}
          path: helper
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the frozen payload carrier
        uses: actions/checkout@v6
        with:
          repository: dhairyajangir/MAVSDK
          ref: ${{ steps.input.outputs.candidate_ref }}
          path: payload
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the clean SDK baseline
        uses: actions/checkout@v6
        with:
          repository: dhairyajangir/MAVSDK
          ref: 6b5940a83da831cc04c1e42286dc12b987bc242d
          path: baseline-source
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Read upstream baseline version tags
        run: git -C baseline-source fetch --tags https://github.com/mavlink/MAVSDK.git

      - name: Pull the exact official image and bind its local identity
        run: |
          set +e
          docker pull "$PINNED_IMAGE" > helper-output/artifacts/logs/image-pull.log 2>&1
          pull_rc=$?
          export PULL_RC="$pull_rc"
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path("helper-output/artifacts/image-pull.json").write_text(
              json.dumps({"requested_image": os.environ["PINNED_IMAGE"],
                          "exit_code": int(os.environ["PULL_RC"])}, indent=2) + "\n")
          PY
          if [ "$pull_rc" -ne 0 ]; then
            exit "$pull_rc"
          fi
          set -e
          docker image inspect "$PINNED_IMAGE" > helper-output/image-inspect.json
          python3 - <<'PY'
          import json, os, pathlib
          raw = json.loads(pathlib.Path("helper-output/image-inspect.json").read_text())[0]
          record = {"requested_image": os.environ["PINNED_IMAGE"],
                    "image_id": raw["Id"], "repo_digests": raw["RepoDigests"],
                    "os": raw["Os"], "architecture": raw["Architecture"]}
          pathlib.Path("helper-output/artifacts/container-image.json").write_text(
              json.dumps(record, indent=2) + "\n")
          PY

      - name: Execute generation, controls, full native gates and owner probes once
        env:
          CARRIER_SHA: ${{ steps.input.outputs.candidate_ref }}
          HELPER_SHA: ${{ github.sha }}
        run: |
          mkdir -p helper-output/work helper-output/cache/native helper-output/cache/xdg helper-output/cache/gradle helper-output/cache/pip
          docker run --rm --pull=never --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/helper-output/cache/native:/.cache" \
            --workdir /workspace \
            --env XDG_CACHE_HOME=/workspace/helper-output/cache/xdg \
            --env GRADLE_USER_HOME=/workspace/helper-output/cache/gradle \
            --env PIP_CACHE_DIR=/workspace/helper-output/cache/pip \
            --env CARRIER_SHA --env HELPER_SHA \
            --env GITHUB_REPOSITORY --env GITHUB_EVENT_NAME \
            --env GITHUB_REF --env GITHUB_SHA \
            --env CI=1 \
            "$PINNED_IMAGE" \
            python3 /workspace/helper/.github/ci/mavsdk3175/driver.py \
              --baseline /workspace/baseline-source \
              --payload /workspace/payload \
              --output /workspace/helper-output/artifacts \
              --work /workspace/helper-output/work \
              --image-proof /workspace/helper-output/artifacts/container-image.json

      - name: Upload bounded evidence, including failed-phase receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mavsdk3175-profile-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            helper-output/artifacts/*.json
            helper-output/artifacts/*requirements.txt
            helper-output/artifacts/commands/*.json
            helper-output/artifacts/phases/*.json
            helper-output/artifacts/logs/*.log
            helper-output/artifacts/junit/*.xml
            helper-output/artifacts/probes/*.json
            helper-output/artifacts/probes/*.log
            helper-output/artifacts/owner-probes/*.py
            helper-output/artifacts/standalone-harness/**
            helper-output/artifacts/input-patches/*.patch
            helper-output/artifacts/source-patches/*.patch
            helper-output/artifacts/changed-generated-source/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 6
